name: test
on:
  push:
  workflow_dispatch:

jobs:
  upload:
    name: upload
    runs-on: ubuntu-latest
    steps:
    - name: Test file
      shell: bash
      run: |
        echo test > test.txt
    - name: upload
      uses: actions/upload-artifact@v7.0.1
      with:
        name: foo
        path: test.txt
        archive: false

  download:
    name: download
    needs: upload
    runs-on: ubuntu-latest
    steps:
    - name: download
      uses: actions/download-artifact@v8.0.1
      with:
        name: test.txt
