name: test
on:
  push:
  workflow_dispatch:

jobs:
  upload:
    name: upload
    runs-on: ubuntu-latest
    steps:
    - name: Test file
      shell: bash
      run: |
        echo test > test.txt
    - name: upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test
        path: test.txt
        archive: false

  download:
    name: download
    needs: upload
    runs-on: ubuntu-latest
    steps:
    - name: download
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: test.txt
